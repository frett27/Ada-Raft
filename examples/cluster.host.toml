# Cluster config for raft_client running on the host machine.
# Node ports match the published ports in docker-compose.yml.

# Optional Raft tuning - see cluster.toml for [raft] keys and defaults.

[cluster]
servers = 3

[[nodes]]
id = 1
host = "127.0.0.1"
port = 9101
audit_port = 9401

[[nodes]]
id = 2
host = "127.0.0.1"
port = 9102
audit_port = 9402

[[nodes]]
id = 3
host = "127.0.0.1"
port = 9103
audit_port = 9403
