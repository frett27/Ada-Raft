# AdaRaft 3-node cluster on a private Docker network.
#
# Start the cluster:
#   docker compose up --build -d
#
# Run the client on the host (build once with: cd examples && alr build):
#   ./bin/raft_client -c cluster.host.toml register
#   ./bin/raft_client -c cluster.host.toml send 42
#   ./bin/raft_client -c cluster.host.toml audit
#
# Published ports (host -> container):
#   9101-9103  Raft UDP
#   9301-9303  client sync TCP (raft port + 200)
#   9401-9403  audit/monitor TCP (raft port + 300)
#
# The client listens on host port 9200; containers reach it via host.docker.internal.

name: adaraft

services:
  raft-node-1:
    image: adaraft-raft-server:local
    build:
      context: ..
      dockerfile: examples/Dockerfile
    hostname: raft-node-1
    command:
      - --config
      - /etc/raft/cluster.toml
      - --server-id
      - "1"
    ports:
      - "9101:9101"
      - "9301:9301"
      - "9401:9401"
    networks:
      - raft
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  raft-node-2:
    image: adaraft-raft-server:local
    depends_on:
      - raft-node-1
    hostname: raft-node-2
    command:
      - --config
      - /etc/raft/cluster.toml
      - --server-id
      - "2"
    ports:
      - "9102:9102"
      - "9302:9302"
      - "9402:9402"
    networks:
      - raft
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  raft-node-3:
    image: adaraft-raft-server:local
    depends_on:
      - raft-node-1
    hostname: raft-node-3
    command:
      - --config
      - /etc/raft/cluster.toml
      - --server-id
      - "3"
    ports:
      - "9103:9103"
      - "9303:9303"
      - "9403:9403"
    networks:
      - raft
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  raft:
    driver: bridge
